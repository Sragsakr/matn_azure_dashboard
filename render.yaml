services:
  - type: web
    name: matn-azure-dashboard
    runtime: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: AZDO_PAT
        sync: false   # set it in the Render dashboard as a secret, never in repo